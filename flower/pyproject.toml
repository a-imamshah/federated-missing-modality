[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "missing-modality-fl"
version = "0.1.0"
description = "Flower version of the missing-modality federated learning experiments"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
    "torch>=2.0",
    "numpy>=1.24",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "local"
fab-format-version = 1
flwr-version-target = "1.43.0"

[tool.flwr.app.components]
serverapp = "fedmm.server_app:app"
clientapp = "fedmm.client_app:app"

# Defaults; override one run with --run-config "key=value ..." (strings in double quotes).
# The number of clients is not here: it is set with --federation-config "num-supernodes=20".
[tool.flwr.app.config]
num-server-rounds = 250
local-epochs = 1
learning-rate = 0.001
batch-size = 64
participation = 1.0
eta = 0.7
missing = "both"
modality-dropout = 0.0
alpha = 0.0
seed = 0
eval-every = 50
feats = "feats8"
out = "results/flower.jsonl"
repo-root = ""
